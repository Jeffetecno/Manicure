name="name"

required>

</label>

<select id="service" name="service" required>

<option value="">

</option>

</select>
<p class="obs-servico" id="servicePricesMessage" role="status" hidden></p>

<p class="obs-servico">
 Preços podem variar de acordo com a nail art desejada 💅🏻
</p>

</div>

<!-- Data -->
<div class="input">

<label for="date">
Data:
</label>

<input type="text" id="date" name="date" placeholder="Selecione a data" required>
<p class="obs-servico">
📅 Atendimento: terça a sábado <br>
🕘 Horário: 09:00 às 19:00
</p>
</div>

<!-- Hora -->
<div class="input">

<label for="time">
Hora:
</label>

<select id="time" name="time" required>
  <option value="">Selecione o horário...</option>
</select>

</div>

<button type="submit">
Agendar Horário
</button>
